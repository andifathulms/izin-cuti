name: Build and deploy

# main builds and deploys. The round-trip, package and escape suites gate it:
# a fill that does not round-trip, a package that loses a part, or an unescaped
# ampersand produces a document somebody hands to their office.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No version pin here: package.json's packageManager field is the one
      # source for it, and naming it twice is how the two drift apart.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint

      # Named individually rather than folded into test:run, so a failure says
      # which promise broke.
      - name: Escaping
        run: pnpm test:escape
      - name: Round-trip
        run: pnpm test:roundtrip
      - name: Package integrity
        run: pnpm test:package
      - name: Drift detection
        run: pnpm test:drift
      - name: Everything else
        run: pnpm test:run

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # No version pin here: package.json's packageManager field is the one
      # source for it, and naming it twice is how the two drift apart.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build static export
        run: pnpm build
        env:
          BASE_PATH: /${{ github.event.repository.name }}

      - name: Confirm .nojekyll
        run: test -f out/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
